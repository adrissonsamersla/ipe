[package]
name = "ipe"
version = "0.1.0"
authors = ["Adrisson Samersla <adrissonsamersla@proton.me>"]
description = "Ipê: a opiniated behavior tree library with serialization/deserialization and bevy ecs support"
license = "MIT"
readme = "README.md"
repository = "https://github.com/adrissonsamersla/ipe"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

#
# Linting
#

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
